[package]
name = "mydl"
version = "0.13.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mydl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librqbit = "9.0.0-rc.0"
anyhow = "1"
# 枚举网卡，给「BT 走哪张网卡」那个设置列候选。librqbit 已经间接依赖它了，
# 提成直接依赖不增加编译成本，但能让我们不用自己写 getifaddrs 的 unsafe。
network-interface = "2"

# net：health.rs 要用 UdpSocket 做 BEP15 scrape。别指望从 tauri/axum 那边
# 靠 feature 合并蹭到，它们哪天去掉这个 feature 我们就编不过了。
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net"] }
# 本地流媒体服务：把 FileStream 包成带 Range 支持的 HTTP 端点
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-single-instance = "2"
tracing-appender = "0.2"
tauri-plugin-notification = "2"
zip = "8.6.0"
feed-rs = "2.4.0"
reqwest = { version = "0.12", features = ["default-tls"] }
tauri-plugin-clipboard-manager = "2.3.2"
quick-xml = "0.41"
# API key 存系统钥匙串（macOS）/ 凭据管理器（Windows），见 secrets.rs。
keyring = { version = "4.1.6", default-features = false, features = [
  "v1",
  "apple-native-keyring-store",
  "windows-native-keyring-store",
] }

# apple 那个后端还要再点一个 keychain 子特性，否则编译期直接 compile_error!。
# **必须限定 target**：放进通用 dependencies 的话 Windows 也会编它，而它里面
# 有 std::os::unix 和 libc::PATH_MAX，直接编译失败。这条是 CI 抓出来的。
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

# 阻止休眠在 Windows 上走 SetThreadExecutionState，见 platform.rs
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_System_Power",          # 阻止休眠
  "Win32_System_Diagnostics_Debug", # 完成提示音 MessageBeep（就在这个模块下）
  "Win32_UI_WindowsAndMessaging",   # MB_ICONASTERISK 常量
] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[dev-dependencies]
# 集成测试需要 #[tokio::test]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# 只用来打本地 http，TLS 由依赖树里已有的 reqwest 特性统一决定
reqwest = { version = "0.12", default-features = false }
zip = "8.6.0"
futures = "0.3.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

