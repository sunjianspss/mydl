name: 发布

# 打 v 开头的 tag 就出两个平台的安装包。也可以在 Actions 页面手动触发，
# 用来验证 workflow 本身能不能跑通 —— 不想为了试 CI 打一串废 tag。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action 要往仓库里建 release，默认的只读令牌不够。
permissions:
  contents: write

jobs:
  # tag 和 tauri.conf.json 里的版本对不上的话，产物文件名会带着旧版本号，
  # 而且要等十几分钟编译完才发现。先花十秒钟卡住。
  check-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: 核对版本号
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          echo "tag=$tag  tauri.conf=$conf  package.json=$pkg"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::版本号对不上。改 tauri.conf.json 和 package.json 里的 version，或者换个 tag。"
            exit 1
          fi

  build:
    needs: [check-version]
    # 手动触发时没有 tag，上面那个 job 会被跳过；skipped 不算失败，
    # 但默认的 needs 依赖会连带跳过这个 job，所以显式放行。
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')

    strategy:
      # 一个平台挂了，另一个继续 —— 至少能拿到一半的包。
      fail-fast: false
      matrix:
        include:
          # Intel Mac 也能跑，所以打 universal 包
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # 跟开发机保持同一个大版本，免得 --frozen-lockfile 因为 lockfile
      # 格式差异跑挂。换开发机 pnpm 版本时记得同步这里。
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # 编译 librqbit 这一坨依赖很慢，缓存能把后续构建从十几分钟压到几分钟。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # 只有真 tag 才建 release。留空就只编译不发布 —— 手动触发时
          # github.ref_name 是分支名，照传会建出一个 tag 为 main 的垃圾草稿。
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: mydl ${{ github.ref_name }}
          releaseBody: |
            两个包都**没有签名**（没买证书），所以不能双击就装：

            **macOS**：拖进「应用程序」后，开终端跑一次

            ```
            xattr -dr com.apple.quarantine /Applications/mydl.app
            ```

            别去找「系统设置 → 隐私与安全性」里的「仍要打开」按钮 —— 那是给
            「有签名但没公证」的 app 的，这个包连有效签名都没有，多半直接报
            「已损坏」，那种情况下按钮不出现。

            **Windows**：SmartScreen 会拦，点「更多信息 → 仍要运行」。
            Win10 还需要 WebView2 运行时（Win11 自带）。

            首次运行时系统会问是否允许网络连接（Windows 是防火墙 4240 端口），
            **要允许**，否则连不上 peer。
          # 先建成草稿，自己看过产物再手动发布。
          releaseDraft: true
          prerelease: false

      # 手动触发不建 release，产物就没地方拿了 —— 挂到这次 run 上，
      # 在 Actions 页面直接下载来试。保留 7 天，不占额度。
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: mydl-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*
